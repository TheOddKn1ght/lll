name: lll
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: ${DATABASE_PATH:-/data/lll.sqlite}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
    volumes:
      - lll-data:/data
      - lll-backups:/backups
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
  backup:
    build: .
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/lll.sqlite}
      BACKUP_DIRECTORY: /backups
    volumes:
      - lll-data:/data
      - lll-backups:/backups
    command: ["bun", "scripts/backup.ts", "watch"]
    healthcheck:
      disable: true # This utility process does not run the app HTTP server.
    depends_on:
      app:
        condition: service_healthy
    init: true
volumes:
  lll-data:
  lll-backups:
