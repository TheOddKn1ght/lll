# Managed by lll
log_format lll_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
server {
    listen 80;
    __IPV6_HTTP__
    server_name __DOMAIN__;
    server_tokens off;
    access_log /var/log/nginx/lll.access.log lll_safe;
    error_log /var/log/nginx/lll.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/lll/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    __IPV6_HTTPS__
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/lll/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lll/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lllTLS:10m;
    server_tokens off;
    access_log /var/log/nginx/lll.access.log lll_safe;
    error_log /var/log/nginx/lll.error.log;
    client_max_body_size 50m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        open_file_cache off;
        if (-f /var/lib/lll/maintenance) { return 503 "lll-maintenance\n"; }
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
    }
}
